name: 'Actions Sanity'
description: 'Lint GitHub Actions workflows for script injection, untrusted checkout under privileged triggers, moving action references and unscoped tokens. No Go toolchain, no hosted service.'
author: 'sujeito-operator'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'File or directory to scan. A directory is searched for .github/workflows, and every *.yml and *.yaml directly inside it is linted -- the same set GitHub runs.'
    required: false
    default: '.'
  fail-on:
    description: 'Fail the step when a finding of this severity or worse survives: error, warning, info, or never.'
    required: false
    default: 'error'
  min-severity:
    description: 'Only report findings of this severity or worse: error, warning, info.'
    required: false
    default: 'info'
  exclude:
    description: 'Comma-separated paths to skip, e.g. demo,**/fixtures/**. For workflows that are broken on purpose -- demos, fixtures, action templates -- where disable: would have to turn the rule off across the whole repository to tolerate one file. Skipped paths are named in the log.'
    required: false
    default: ''
  disable:
    description: 'Comma-separated rule ids to suppress, e.g. no-permissions,cache-key-static.'
    required: false
    default: ''
  enable:
    description: 'Comma-separated rule ids that are off by default to turn back on. Today that is only no-timeout.'
    required: false
    default: ''
  json:
    description: 'Emit JSON instead of human-readable output.'
    required: false
    default: 'false'
  first-party-owner:
    description: 'Whose actions are treated as first party, alongside actions/* and github/*. "auto" reads the owner from GITHUB_REPOSITORY, so an action you publish yourself is not reported as one whose author might re-tag it under you -- you are the author. Use "off" to report every non-GitHub action, or give an owner name to override. The owner actually applied is printed with the findings.'
    required: false
    default: 'auto'

runs:
  using: 'composite'
  steps:
    - name: Run actions-sanity
      shell: bash
      # Inputs are passed through the environment and quoted, never interpolated into the
      # script body. `${{ inputs.x }}` expanded inline is the script-injection hole this
      # action exists to find: the expansion happens before bash sees the line, so a value
      # containing a shell metacharacter runs as code with this job's token in scope.
      # A linter that ships the bug it reports has no standing to report it.
      env:
        AS_PATH: ${{ inputs.path }}
        AS_FAIL_ON: ${{ inputs.fail-on }}
        AS_MIN_SEVERITY: ${{ inputs.min-severity }}
        AS_EXCLUDE: ${{ inputs.exclude }}
        AS_DISABLE: ${{ inputs.disable }}
        AS_ENABLE: ${{ inputs.enable }}
        AS_JSON: ${{ inputs.json }}
        AS_OWNER: ${{ inputs.first-party-owner }}
      run: |
        set -euo pipefail
        args=( --no-color --fail-on "$AS_FAIL_ON" --min-severity "$AS_MIN_SEVERITY" )
        # "auto" passes nothing, leaving cli.js to read GITHUB_REPOSITORY -- which the
        # runner always sets, so the common case needs no input at all. "off" passes an
        # explicit empty owner, which turns the exemption off rather than re-enabling
        # detection. Anything else is taken literally as the owner name.
        if [ "$AS_OWNER" = "off" ]; then args+=( --owner "" )
        elif [ -n "$AS_OWNER" ] && [ "$AS_OWNER" != "auto" ]; then args+=( --owner "$AS_OWNER" ); fi
        if [ -n "$AS_EXCLUDE" ]; then args+=( --exclude "$AS_EXCLUDE" ); fi
        if [ -n "$AS_DISABLE" ]; then args+=( --disable "$AS_DISABLE" ); fi
        if [ -n "$AS_ENABLE" ]; then args+=( --enable "$AS_ENABLE" ); fi
        if [ "$AS_JSON" = "true" ]; then args+=( --json ); fi
        node "$GITHUB_ACTION_PATH/cli.js" "${args[@]}" "$AS_PATH"
